<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monsprat Barber Studio - Turnos</title>
    
    <!-- Flatpickr CSS (Estilos del Calendario) -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/themes/dark.css">

    <style>
        * {
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0d0d0d;
            color: #f1f1f1;
            margin: 0;
            padding: 30px 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .main-wrapper {
            display: flex;
            flex-wrap: wrap;
            gap: 30px;
            max-width: 900px;
            width: 100%;
            justify-content: center;
        }
        .card {
            background-color: #1a1a1a;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 6px 25px rgba(0, 0, 0, 0.8);
            border: 1px solid #2a2a2a;
            flex: 1 1 400px;
            max-width: 440px;
        }
        .header-logo {
            text-align: center;
            margin-bottom: 20px;
        }
        .header-logo img {
            max-width: 130px;
            height: auto;
            border-radius: 8px;
            border: 1px solid #c5a059;
            padding: 4px;
            background: #0d0d0d;
        }
        h2 {
            text-align: center;
            color: #c5a059;
            margin-top: 0;
            margin-bottom: 25px;
            font-weight: 300;
            letter-spacing: 1px;
            text-transform: uppercase;
            font-size: 1.2rem;
            border-bottom: 1px solid #2a2a2a;
            padding-bottom: 10px;
        }
        .form-group {
            margin-bottom: 18px;
        }
        label {
            display: block;
            margin-bottom: 6px;
            font-size: 13px;
            color: #aaa;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        input, select {
            width: 100%;
            padding: 12px;
            border: 1px solid #333;
            border-radius: 6px;
            background-color: #252525;
            color: #fff;
            font-size: 14px;
            transition: border 0.3s;
        }
        input:focus, select:focus {
            outline: none;
            border-color: #c5a059;
        }
        button {
            width: 100%;
            padding: 14px;
            background-color: #c5a059;
            border: none;
            border-radius: 6px;
            color: #0d0d0d;
            font-weight: bold;
            font-size: 15px;
            cursor: pointer;
            margin-top: 15px;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: background 0.3s ease;
        }
        button:hover {
            background-color: #a38241;
        }
        .filter-box {
            background: #222;
            padding: 12px;
            border-radius: 6px;
            margin-bottom: 15px;
            border: 1px solid #333;
        }
        .schedule-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            margin-top: 15px;
            max-height: 280px;
            overflow-y: auto;
            padding-right: 5px;
        }
        .time-slot {
            background: #252525;
            padding: 10px;
            border-radius: 6px;
            text-align: center;
            border: 1px solid #333;
            font-size: 13px;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .time-slot:hover {
            border-color: #c5a059;
            background: #2e2e2e;
        }
        .time-slot.selected {
            background: #c5a059;
            color: #0d0d0d;
            border-color: #ffffff;
            font-weight: bold;
        }
        .time-slot.selected .status-badge {
            background-color: #0d0d0d;
            color: #c5a059;
        }
        .status-badge {
            display: inline-block;
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 10px;
            font-weight: bold;
            margin-top: 3px;
            background-color: #1e3a29;
            color: #2ecc71;
        }
        .note {
            font-size: 12px;
            color: #888;
            margin-top: 15px;
            text-align: center;
        }
    </style>
</head>
<body>

<form action="ReservarTurnoServlet" method="POST" id="bookingForm" class="main-wrapper">
    <!-- Campo oculto para enviar la hora elegida desde la cuadrícula al backend -->
    <input type="hidden" id="hora" name="hora" required>

    <!-- FORMULARIO DE RESERVA (SIN EL CAMPOS DE HORA) -->
    <div class="card">
        <div class="header-logo">
            <img src="images/logo.jpg" alt="Monsprat Barber Studio Logo">
        </div>

        <h2>Reserva de Turno</h2>

        <div class="form-group">
            <label for="cliente">Nombre Completo</label>
            <input type="text" id="cliente" name="cliente" required placeholder="Ej. Carlos Mendoza">
        </div>

        <div class="form-group">
            <label for="servicio">Servicio</label>
            <select id="servicio" name="servicio" required>
                <option value="Corte de Cabello">Corte de Cabello (60 min)</option>
                <option value="Arreglo de Barba">Arreglo de Barba (60 min)</option>
                <option value="Corte + Barba">Corte + Barba (60 min)</option>
                <option value="Tintura / Color">Tintura / Color (60 min)</option>
            </select>
        </div>

        <div class="form-group">
            <label for="fecha">Fecha</label>
            <input type="text" id="fecha" name="fecha" required placeholder="Selecciona una fecha disponible">
        </div>
    </div>

    <!-- PANEL DE FRANJAS DISPONIBLES Y BOTÓN FINAL DE CONFIRMACIÓN -->
    <div class="card">
        <h2>Disponibilidad en Tiempo Real</h2>

        <div class="filter-box">
            <label for="fechaFiltro">Fecha seleccionada:</label>
            <input type="text" id="fechaFiltro" name="fechaFiltro" placeholder="Selecciona una fecha a la izquierda" readonly>
        </div>

        <label>Selecciona tu horario:</label>
        <div class="schedule-grid" id="scheduleGrid">
            <div class="time-slot" data-time="10:00"><div>10:00 AM</div><span class="status-badge">60 min</span></div>
            <div class="time-slot" data-time="11:00"><div>11:00 AM</div><span class="status-badge">60 min</span></div>
            <div class="time-slot" data-time="12:00"><div>12:00 PM</div><span class="status-badge">60 min</span></div>
            <div class="time-slot" data-time="13:00"><div>01:00 PM</div><span class="status-badge">60 min</span></div>
            <div class="time-slot" data-time="14:00"><div>02:00 PM</div><span class="status-badge">60 min</span></div>
            <div class="time-slot" data-time="15:00"><div>03:00 PM</div><span class="status-badge">60 min</span></div>
            <div class="time-slot" data-time="16:00"><div>04:00 PM</div><span class="status-badge">60 min</span></div>
            <div class="time-slot" data-time="17:00"><div>05:00 PM</div><span class="status-badge">60 min</span></div>
            <div class="time-slot" data-time="18:00"><div>06:00 PM</div><span class="status-badge">60 min</span></div>
            <div class="time-slot" data-time="19:00"><div>07:00 PM</div><span class="status-badge">60 min</span></div>
        </div>

        <button type="submit">Confirmar Reserva</button>

        <p class="note">
            * Selecciona una franja horaria para habilitar la confirmación.
        </p>
    </div>
</form>

<!-- Scripts de Flatpickr -->
<script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
<script src="https://npmcdn.com/flatpickr/dist/l10n/es.js"></script>

<script>
    const festivosColombia = [
        "2026-01-01", "2026-01-12", "2026-03-23", "2026-04-02", "2026-04-03", 
        "2026-05-01", "2026-05-18", "2026-06-08", "2026-06-15", "2026-06-29", 
        "2026-07-20", "2026-08-07", "2026-08-17", "2026-10-12", "2026-11-02", 
        "2026-11-16", "2026-12-08", "2026-12-25"
    ];

    const inputFecha = document.getElementById("fecha");
    const inputFechaFiltro = document.getElementById("fechaFiltro");
    const inputHora = document.getElementById("hora");
    const timeSlots = document.querySelectorAll(".time-slot");

    const configFlatpickr = {
        locale: "es",
        dateFormat: "Y-m-d",
        minDate: "today",
        maxDate: new Date().fp_incr(15),
        disable: [
            function(date) {
                const esDomingo = (date.getDay() === 0);
                const year = date.getFullYear();
                const month = String(date.getMonth() + 1).padStart(2, '0');
                const day = String(date.getDate()).padStart(2, '0');
                const fechaFormateada = `${year}-${month}-${day}`;
                return esDomingo || festivosColombia.includes(fechaFormateada);
            }
        ],
        onChange: function(selectedDates, dateStr) {
            inputFechaFiltro.value = dateStr;
        }
    };

    flatpickr("#fecha", configFlatpickr);

    // Asignación de hora mediante clic en los cuadros de franja horaria
    timeSlots.forEach(slot => {
        slot.addEventListener("click", function() {
            timeSlots.forEach(s => s.classList.remove("selected"));
            this.classList.add("selected");
            inputHora.value = this.getAttribute("data-time");
        });
    });

    // Validación al enviar el formulario
    document.getElementById("bookingForm").addEventListener("submit", function(e) {
        if (!inputFecha.value) {
            alert("Por favor, selecciona una fecha.");
            e.preventDefault();
            return;
        }
        if (!inputHora.value) {
            alert("Por favor, selecciona una franja horaria haciendo clic en uno de los bloques de horario.");
            e.preventDefault();
            return;
        }
    });
</script>

</body>
</html>
